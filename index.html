<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏈 Fantasy Football League Analysis</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
    <style>
        /*
          Color scheme: Chicago Bears (navy + orange), structured as a light-canvas token
          system in the spirit of the Apple-style reference the user provided - alternating
          white/light-gray bands, borderless cards, no shadows, pill buttons, one chromatic
          accent reserved for actions. Semantic status colors (success/danger) stay
          conventional green/red so stat direction reads instantly regardless of brand colors.
        */
        :root {
            --color-ink: #0B162A;           /* Bears Navy - headings, primary text */
            --color-ink-secondary: #52607A; /* muted navy-gray - secondary text */
            --color-canvas: #F2F4F8;        /* light band background */
            --color-paper: #FFFFFF;         /* card / page background */
            --color-hairline: #DCE0E8;      /* borders */
            --color-accent: #C83803;        /* Bears Orange - primary CTA */
            --color-accent-hover: #A62E02;
            --color-accent-soft: #FCE7DC;   /* light orange tint - badges, hover fills */
            --color-navy-soft: #E7EAF2;     /* light navy tint - secondary chips */
            --color-success: #1B8A5A;
            --color-success-soft: #E3F4EC;
            --color-danger: #C0392B;
            --color-danger-soft: #FBE7E4;
            --radius-card: 20px;
            --radius-pill: 999px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Better touch interaction for mobile */
        * {
            -webkit-tap-highlight-color: rgba(200, 56, 3, 0.25);
        }

        html {
            /* Improve text rendering on mobile */
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, Geneva, Verdana, sans-serif;
            background: var(--color-canvas);
            color: var(--color-ink);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 36px 30px;
            background: var(--color-paper);
            border-radius: 28px;
            border: 1px solid var(--color-hairline);
        }

        .header h1 {
            font-size: 2.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: var(--color-ink);
        }

        .header p {
            font-size: 1.1rem;
            color: var(--color-ink-secondary);
        }

        .step-container {
            background: var(--color-paper);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-card);
            padding: 30px;
            margin-bottom: 30px;
        }

        .step-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: var(--color-ink);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--color-ink);
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-hairline);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--color-paper);
            color: var(--color-ink);
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .btn {
            background: var(--color-accent);
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: var(--radius-pill);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn:hover {
            background: var(--color-accent-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .leagues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .league-card {
            background: var(--color-paper);
            border-radius: var(--radius-card);
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid var(--color-hairline);
        }

        .league-card:hover {
            border-color: var(--color-accent);
        }

        .league-card.selected {
            border-color: var(--color-accent);
            background: var(--color-accent-soft);
        }

        .league-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--color-ink);
        }

        .league-details {
            color: var(--color-ink-secondary);
            font-size: 0.9rem;
        }

        .progress-container {
            margin-top: 20px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 16px;
            background: var(--color-navy-soft);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--color-accent);
            transition: width 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            width: 0%;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
            animation: shimmer-progress 2s linear infinite;
        }

        @keyframes shimmer-progress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .progress-text {
            margin-top: 10px;
            font-size: 0.9rem;
            transition: opacity 0.3s ease;
            font-weight: 500;
            color: var(--color-ink-secondary);
        }

        .error {
            color: var(--color-danger);
            background: var(--color-danger-soft);
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .success {
            color: var(--color-success);
            background: var(--color-success-soft);
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.4);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        .loading.hidden {
            display: none !important;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results-container {
            margin-top: 30px;
        }

        /* Sticky jump-to nav - every report gets a pill link here, clicking smooth-scrolls to
           its section further down the same page instead of opening a separate view. */
        .results-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            position: sticky;
            top: 10px;
            z-index: 10;
            background: var(--color-paper);
            padding: 10px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--color-hairline);
        }

        .results-nav a {
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            background: var(--color-navy-soft);
            color: var(--color-ink);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.2s ease, color 0.2s ease;
            white-space: nowrap;
        }

        .results-nav a:hover {
            background: var(--color-accent-soft);
            color: var(--color-accent);
        }

        /* Each report gets its own section, stacked so you can just scroll through all of
           them - the nav above is only a shortcut, not the only way to reach one. */
        .result-section {
            background: var(--color-paper);
            border: 1px solid var(--color-hairline);
            border-radius: var(--radius-card);
            padding: 24px;
            margin-bottom: 24px;
            scroll-margin-top: 70px; /* keeps the sticky nav from covering the heading on jump */
        }

        .result-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .result-section-header h3 {
            color: var(--color-ink);
            font-size: 1.3rem;
        }

        .result-section-header a.open-full {
            font-size: 0.85rem;
            color: var(--color-accent);
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
        }

        .result-section-header a.open-full:hover {
            text-decoration: underline;
        }

        .result-section-frame-wrap {
            overflow-x: auto;
            border: 1px solid var(--color-hairline);
            border-radius: 14px;
        }

        .result-section iframe {
            width: 100%;
            height: 820px;
            border: none;
            display: block;
        }

        .result-section .empty-note {
            color: var(--color-ink-secondary);
            font-style: italic;
        }

        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .header {
                padding: 20px;
                margin-bottom: 20px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .header p {
                font-size: 1rem;
            }
            
            .step-container {
                padding: 20px;
                margin-bottom: 20px;
            }
            
            .step-title {
                font-size: 1.3rem;
            }
            
            .leagues-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .league-card {
                padding: 15px;
            }
            
            .league-name {
                font-size: 1.2rem;
            }
            
            .btn {
                padding: 15px 20px;
                font-size: 1.1rem;
                min-height: 44px; /* iOS touch target size */
            }
            
            .results-nav {
                gap: 6px;
                padding: 8px;
            }

            .results-nav a {
                padding: 7px 12px;
                font-size: 0.8rem;
            }

            .result-section {
                padding: 16px;
            }

            .result-section-header h3 {
                font-size: 1.1rem;
            }

            .result-section iframe {
                height: 600px;
            }

            /* Make click targets larger for mobile */
            .input-group input {
                padding: 15px;
                font-size: 16px; /* Prevents zoom on iOS */
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .header p {
                font-size: 0.9rem;
            }
            
            .step-container {
                padding: 15px;
            }
            
            .step-title {
                font-size: 1.2rem;
            }
            
            .league-card {
                padding: 12px;
            }
            
            .league-name {
                font-size: 1.1rem;
            }
            
            .league-details {
                font-size: 0.8rem;
            }
            
            body {
                padding: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏈 Fantasy Football Analysis</h1>
            <p>Enter your Sleeper username to analyze your leagues</p>
        </div>

        <!-- Step 1: Username Input -->
        <div id="step1" class="step-container">
            <h2 class="step-title">Step 1: Enter Your Sleeper Username</h2>
            <div class="input-group">
                <label for="username">Sleeper Username:</label>
                <input type="text" id="username" placeholder="Enter your Sleeper username">
            </div>
            <div class="input-group">
                <label for="season">Season:</label>
                <select id="season"></select>
            </div>
            <button id="fetchLeaguesBtn" class="btn">
                <span id="fetchBtnText">Find My Leagues</span>
                <span id="fetchBtnLoading" class="loading hidden"></span>
            </button>
            <button onclick="forceResetApp()" style="background: transparent; color: var(--color-ink); border: 1px solid var(--color-hairline); padding: 12px 24px; border-radius: 999px; margin-left: 10px; font-size: 1rem; cursor: pointer;">
                Clear Cache
            </button>
            <div id="usernameError" class="error hidden"></div>
        </div>

        <!-- Step 2: League Selection -->
        <div id="step2" class="step-container hidden">
            <h2 class="step-title">Step 2: Select a League to Analyze</h2>
            <div id="userInfo"></div>
            <div id="leaguesContainer" class="leagues-grid"></div>
            <button id="analyzeBtn" class="btn hidden">
                <span id="analyzeBtnText">Analyze Selected League</span>
                <span id="analyzeBtnLoading" class="loading hidden"></span>
            </button>
            <div id="leagueError" class="error hidden"></div>
        </div>

        <!-- Step 3: Analysis Progress -->
        <div id="step3" class="step-container hidden">
            <h2 class="step-title">Step 3: Analyzing Your League</h2>
            <div class="progress-container">
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
                <div id="progressText" class="progress-text">Taking the field...</div>
            </div>
            <div id="analysisError" class="error hidden"></div>
            <div id="analysisSuccess" class="success hidden"></div>
        </div>

        <!-- Step 4: Results -->
        <div id="step4" class="step-container hidden">
            <h2 class="step-title">Analysis Complete! 🎉</h2>
            <p>Every report lives on this page - scroll down or jump to one:</p>
            <nav id="resultsNav" class="results-nav"></nav>
            <div id="resultsContainer" class="results-sections">
                <!-- Report sections will be populated dynamically -->
            </div>
            <button id="newAnalysisBtn" class="btn" style="margin-top: 20px;">Start New Analysis</button>
        </div>
    </div>

    <script>
        let selectedLeague = null;
        let currentAnalysisId = null;

        // Populate the season dropdown from the server's current NFL season instead of a
        // hardcoded year that would go stale every offseason.
        async function initSeasonPicker() {
            const select = document.getElementById('season');
            let currentSeason = new Date().getFullYear();
            try {
                const response = await fetch('/api/current-season');
                const data = await response.json();
                if (response.ok && data.season) {
                    currentSeason = data.season;
                }
            } catch (error) {
                console.warn('Could not fetch current season, defaulting to', currentSeason);
            }

            select.innerHTML = '';
            for (let year = currentSeason; year >= currentSeason - 4; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                select.appendChild(option);
            }
        }

        // Initialize page when DOM is loaded
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('DOM loaded, initializing...');
            await initSeasonPicker();

            // Check for forced reset in URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('reset') || urlParams.has('clear')) {
                console.log('Reset requested via URL parameter');
                forceResetApp();
                // Remove reset parameter from URL without page reload
                const newUrl = window.location.pathname;
                window.history.replaceState({}, document.title, newUrl);
                return; // Skip state restoration
            }

            // Restore saved state if available
            restoreAnalysisState();
            
            // Force reset all loading states
            const loadingSpinners = document.querySelectorAll('.loading');
            loadingSpinners.forEach(spinner => {
                spinner.style.display = 'none';
                spinner.classList.add('hidden');
            });
            
            const buttonTexts = document.querySelectorAll('[id$="BtnText"]');
            buttonTexts.forEach(text => {
                text.style.display = 'inline';
                text.classList.remove('hidden');
            });
            
            // Reset button states
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => {
                btn.disabled = false;
            });
            
            console.log('Initial state reset complete');
        });

        // State management functions
        function saveAnalysisState() {
            const state = {
                username: document.getElementById('username').value,
                season: document.getElementById('season').value,
                step2Visible: !document.getElementById('step2').classList.contains('hidden'),
                step3Visible: !document.getElementById('step3').classList.contains('hidden'),
                step4Visible: !document.getElementById('step4').classList.contains('hidden'),
                selectedLeague: window.selectedLeague || null,
                leagues: window.userLeagues || null,
                analysisComplete: window.analysisComplete || false,
                timestamp: Date.now()
            };
            
            localStorage.setItem('fantasyAnalysisState', JSON.stringify(state));
        }

        function restoreAnalysisState() {
            try {
                const savedState = localStorage.getItem('fantasyAnalysisState');
                if (!savedState) return;
                
                const state = JSON.parse(savedState);
                
                // Only restore if less than 24 hours old
                if (Date.now() - state.timestamp > 24 * 60 * 60 * 1000) {
                    localStorage.removeItem('fantasyAnalysisState');
                    return;
                }
                
                // Restore username
                if (state.username) {
                    document.getElementById('username').value = state.username;
                }
                if (state.season) {
                    document.getElementById('season').value = state.season;
                }

                // Restore step visibility
                if (state.step2Visible) {
                    document.getElementById('step2').classList.remove('hidden');
                    window.userLeagues = state.leagues;
                }

                if (state.step3Visible) {
                    document.getElementById('step3').classList.remove('hidden');
                    window.selectedLeague = state.selectedLeague;
                    
                    // Update step 3 content if league is selected
                    if (state.selectedLeague) {
                        const step3Content = document.getElementById('step3').querySelector('.step-content');
                        step3Content.innerHTML = `
                            <h3>✅ League Selected</h3>
                            <div class="selected-league">
                                <p><strong>League:</strong> ${state.selectedLeague.name}</p>
                                <p><strong>Season:</strong> ${state.selectedLeague.season}</p>
                                <p><strong>Teams:</strong> ${state.selectedLeague.total_rosters}</p>
                            </div>
                        `;
                    }
                }
                
                if (state.step4Visible) {
                    document.getElementById('step4').classList.remove('hidden');
                    window.analysisComplete = state.analysisComplete;
                    
                    // If analysis was complete, restore the results
                    if (state.analysisComplete) {
                        loadResults();
                    }
                }
                
                console.log('Analysis state restored');
            } catch (error) {
                console.error('Error restoring state:', error);
                localStorage.removeItem('fantasyAnalysisState');
            }
        }

        function clearAnalysisState() {
            localStorage.removeItem('fantasyAnalysisState');
            // Also clear any other potential storage
            localStorage.clear();
            sessionStorage.clear();
            console.log('All browser storage cleared');
        }

        // Add a debug function to completely reset everything
        function forceResetApp() {
            // Clear all storage
            clearAnalysisState();
            
            // Clear form data
            document.getElementById('username').value = '';
            
            // Reset all global variables
            selectedLeague = null;
            window.selectedLeague = null;
            window.userLeagues = null;
            currentAnalysisId = null;
            window.analysisComplete = false;
            
            // Hide all steps
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step4').classList.add('hidden');
            document.getElementById('analyzeBtn').classList.add('hidden');
            
            // Clear any error messages
            hideError('usernameError');
            hideError('leagueError');
            
            // Clear containers
            const userInfo = document.getElementById('userInfo');
            if (userInfo) userInfo.innerHTML = '';
            
            const leaguesContainer = document.getElementById('leaguesContainer');
            if (leaguesContainer) leaguesContainer.innerHTML = '';
            
            const resultsContainer = document.getElementById('resultsContainer');
            if (resultsContainer) resultsContainer.innerHTML = '';
            
            console.log('App completely reset');
        }

        // Step 1: Fetch leagues for username
        document.getElementById('fetchLeaguesBtn').addEventListener('click', async () => {
            console.log('Fetch leagues button clicked');
            const username = document.getElementById('username').value.trim();
            if (!username) {
                showError('usernameError', 'Please enter a username');
                return;
            }

            console.log('Setting loading state...');
            setButtonLoading('fetchLeaguesBtn', true);
            hideError('usernameError');

            const season = document.getElementById('season').value;

            try {
                console.log('Making API request for username:', username, 'season:', season);
                const response = await fetch(`/api/user/${username}?season=${season}`);
                console.log('Response received:', response.status);

                const data = await response.json();
                console.log('Data received:', data);

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to fetch leagues');
                }

                // Show user info and leagues
                showUserLeagues(data.user, data.leagues, data.season);
                document.getElementById('step2').classList.remove('hidden');
                
                // Save state after showing leagues
                saveAnalysisState();

            } catch (error) {
                console.error('Error fetching leagues:', error);
                showError('usernameError', error.message);
            } finally {
                console.log('Clearing loading state...');
                setButtonLoading('fetchLeaguesBtn', false);
            }
        });

        // Show user leagues
        function showUserLeagues(user, leagues, season) {
            const userInfo = document.getElementById('userInfo');
            userInfo.innerHTML = `
                <p><strong>User:</strong> ${user.display_name || user.username}</p>
                <p><strong>Found ${leagues.length} leagues for the ${season} season</strong></p>
            `;

            const container = document.getElementById('leaguesContainer');
            container.innerHTML = '';

            leagues.forEach(league => {
                const isFaab = league.settings && league.settings.waiver_type === 2;
                const card = document.createElement('div');
                card.className = 'league-card';
                card.innerHTML = `
                    <div class="league-name">${league.name}</div>
                    <div class="league-details">
                        <div>Teams: ${league.total_rosters}</div>
                        <div>Status: ${league.status}</div>
                        <div>League ID: ${league.league_id}</div>
                        ${isFaab ? '<div>💰 FAAB waivers enabled</div>' : ''}
                    </div>
                `;

                card.addEventListener('click', () => {
                    // Remove previous selection
                    document.querySelectorAll('.league-card').forEach(c => c.classList.remove('selected'));

                    // Select this card
                    card.classList.add('selected');
                    selectedLeague = {
                        league_id: league.league_id,
                        league_name: league.name,
                        username: user.username,
                        season: league.season || season
                    };

                    // Update window reference
                    window.selectedLeague = selectedLeague;

                    // Show analyze button
                    document.getElementById('analyzeBtn').classList.remove('hidden');

                    // Save state after league selection
                    saveAnalysisState();
                });

                container.appendChild(card);
            });
        }

        // Step 2: Start analysis
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            if (!selectedLeague) {
                showError('leagueError', 'Please select a league');
                return;
            }

            setButtonLoading('analyzeBtn', true);
            hideError('leagueError');

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(selectedLeague)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to start analysis');
                }

                currentAnalysisId = data.analysis_id;
                document.getElementById('step3').classList.remove('hidden');
                
                // Save state after starting analysis
                saveAnalysisState();
                
                // Start polling for status
                pollAnalysisStatus();

            } catch (error) {
                showError('leagueError', error.message);
            } finally {
                setButtonLoading('analyzeBtn', false);
            }
        });

        // Poll analysis status
        function pollAnalysisStatus() {
            if (!currentAnalysisId) return;

            const poll = async () => {
                try {
                    const response = await fetch(`/api/status/${currentAnalysisId}`);
                    const status = await response.json();

                    if (response.ok) {
                        updateProgress(status.progress, status.message);

                        if (status.status === 'completed') {
                            showAnalysisComplete();
                            loadResults();
                        } else if (status.status === 'error') {
                            showError('analysisError', status.message);
                        } else if (status.status !== 'completed') {
                            // Continue polling more frequently for better responsiveness
                            setTimeout(poll, 1000);
                        }
                    }
                } catch (error) {
                    showError('analysisError', 'Failed to get analysis status');
                }
            };

            poll();
        }

        // Football-flavored loading lines, keyed to the real progress checkpoints so they still
        // advance in lockstep with actual work happening server-side - they just don't bother
        // describing it literally.
        const FUN_LOADING_MESSAGES = [
            [0, 'Taking the field...'],
            [5, 'Huddling up...'],
            [10, 'Establishing the run...'],
            [20, 'Reading the defense...'],
            [28, 'Drawing up a play...'],
            [35, 'Checking the play clock...'],
            [42, 'Snapping the ball...'],
            [50, 'Taking a deep shot downfield...'],
            [58, 'Going for it on 4th down...'],
            [63, 'Audibling at the line...'],
            [67, 'Breaking the huddle...'],
            [72, 'Calling a timeout to think it over...'],
            [76, 'Reviewing the instant replay...'],
            [82, 'Measuring for the first down...'],
            [87, 'Icing the kicker...'],
            [92, 'Two-minute drill in progress...'],
            [95, 'Drawing up a trick play...'],
            [97, 'Spiking the ball...'],
            [99, 'Taking a knee in the victory formation...'],
            [100, 'Touchdown! 🏈'],
        ];

        function getFunLoadingMessage(progress) {
            let phrase = FUN_LOADING_MESSAGES[0][1];
            for (const [threshold, text] of FUN_LOADING_MESSAGES) {
                if (progress >= threshold) phrase = text;
            }
            return phrase;
        }

        // Update progress bar
        function updateProgress(progress, message) {
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            // Smooth progress bar animation
            progressFill.style.width = progress + '%';

            // Add a subtle pulse effect when progress changes
            progressFill.style.boxShadow = '0 0 20px rgba(200, 56, 3, 0.5)';
            setTimeout(() => {
                progressFill.style.boxShadow = 'none';
            }, 300);

            // Update text with fade effect - shown text is a fun football phrase, not the
            // literal backend status message (that's still logged to the console if you're
            // curious what's actually happening).
            console.log('[DEBUG] Actual status:', message);
            const funMessage = getFunLoadingMessage(progress);
            progressText.style.opacity = '0.5';
            setTimeout(() => {
                progressText.textContent = `${funMessage} (${progress}%)`;
                progressText.style.opacity = '1';
            }, 150);
        }

        // Show analysis complete
        function showAnalysisComplete() {
            document.getElementById('analysisSuccess').textContent = 'Touchdown! Your analysis is ready. 🏈';
            document.getElementById('analysisSuccess').classList.remove('hidden');
        }

        // Known report files, in the order they should appear on the page. Every report gets
        // its own section (own "spot") - you can scroll straight down through all of them, or
        // click a pill in the sticky nav to jump directly to one.
        const REPORT_META = {
            'ai_overview.html': { title: 'League Overview', icon: '🤖' },
            'power_rating_interactive.html': { title: 'Power Rankings', icon: '⚡' },
            'power_ranking_leaderboard.html': { title: 'Power Ranking Leaderboard', icon: '📋' },
            'roster_grades_interactive.html': { title: 'Roster Grades', icon: '📊' },
            'luck_analysis.html': { title: 'Luck Analysis', icon: '🍀' },
            'trade_analysis.html': { title: 'Trade Analysis', icon: '🔄' },
            'waiver_analysis.html': { title: 'Waiver Analysis', icon: '📈' },
            'manager_grades.html': { title: 'Manager Grades', icon: '🏆' },
            'worst_trades_report.html': { title: 'Worst Trades', icon: '🚨' },
        };
        const REPORT_ORDER = Object.keys(REPORT_META);

        function prettifyFilename(filename) {
            return filename
                .replace('.html', '')
                .replace(/_/g, ' ')
                .replace(/\b\w/g, l => l.toUpperCase());
        }

        // Load and display results, scoped to the league+season that was just analyzed
        async function loadResults() {
            if (!window.selectedLeague) {
                console.error('No selected league/season to load results for');
                return;
            }
            const { league_id, season } = window.selectedLeague;

            try {
                console.log('[DEBUG] Loading results for', league_id, season);
                const response = await fetch(`/api/results?league_id=${league_id}&season=${season}`);
                const results = await response.json();

                console.log('[DEBUG] Results received:', results);

                const nav = document.getElementById('resultsNav');
                const container = document.getElementById('resultsContainer');
                nav.innerHTML = '';
                container.innerHTML = '';

                const available = results.html_reports || [];
                // Known reports first, in a stable curated order; anything unrecognized still
                // shows up at the end instead of silently disappearing.
                const orderedFiles = REPORT_ORDER.filter(f => available.includes(f));
                const extraFiles = available.filter(f => !REPORT_ORDER.includes(f));
                const files = [...orderedFiles, ...extraFiles];

                if (files.length === 0) {
                    container.innerHTML = "<p class='empty-note'>No reports were generated for this analysis.</p>";
                } else {
                    files.forEach((file, index) => {
                        const meta = REPORT_META[file] || { title: prettifyFilename(file), icon: '📄' };
                        const sectionId = `report-${index}`;
                        const src = `/results/${file}?league_id=${league_id}&season=${season}`;

                        const navLink = document.createElement('a');
                        navLink.href = `#${sectionId}`;
                        navLink.textContent = `${meta.icon} ${meta.title}`;
                        nav.appendChild(navLink);

                        const section = document.createElement('section');
                        section.className = 'result-section';
                        section.id = sectionId;
                        section.innerHTML = `
                            <div class="result-section-header">
                                <h3>${meta.icon} ${meta.title}</h3>
                                <a class="open-full" href="${src}" target="_blank" rel="noopener noreferrer">Open full size &#8599;</a>
                            </div>
                            <div class="result-section-frame-wrap">
                                <iframe src="${src}" loading="lazy" title="${meta.title}"></iframe>
                            </div>
                        `;
                        container.appendChild(section);
                    });
                }

                document.getElementById('step4').classList.remove('hidden');

                // Mark analysis as complete and save state
                window.analysisComplete = true;
                saveAnalysisState();

            } catch (error) {
                console.error('Failed to load results:', error);
            }
        }

        // Start new analysis
        document.getElementById('newAnalysisBtn').addEventListener('click', () => {
            // Reset all steps
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step4').classList.add('hidden');
            
            // Reset form
            document.getElementById('username').value = '';
            selectedLeague = null;
            window.selectedLeague = null;
            currentAnalysisId = null;
            window.analysisComplete = false;
            
            // Clear saved state
            clearAnalysisState();
            
            // Hide buttons
            document.getElementById('analyzeBtn').classList.add('hidden');
            
            // Clear errors
            hideError('usernameError');
            hideError('leagueError');
            hideError('analysisError');
        });

        // Utility functions
        function setButtonLoading(buttonId, loading) {
            console.log('setButtonLoading called:', buttonId, loading);
            const btn = document.getElementById(buttonId);
            const text = document.getElementById(buttonId.replace('Btn', 'BtnText'));
            const loader = document.getElementById(buttonId.replace('Btn', 'BtnLoading'));

            console.log('Elements found:', btn, text, loader);

            if (!btn || !text || !loader) {
                console.error('Could not find button elements for:', buttonId);
                return;
            }

            btn.disabled = loading;
            if (loading) {
                text.style.display = 'none';
                text.classList.add('hidden');
                loader.style.display = 'inline-block';
                loader.classList.remove('hidden');
            } else {
                text.style.display = 'inline';
                text.classList.remove('hidden');
                loader.style.display = 'none';
                loader.classList.add('hidden');
            }
        }

        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.classList.remove('hidden');
        }

        function hideError(elementId) {
            document.getElementById(elementId).classList.add('hidden');
        }

        // Enter key support for username input
        document.getElementById('username').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('fetchLeaguesBtn').click();
            }
        });

    </script>
</body>
</html>
