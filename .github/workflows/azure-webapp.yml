# Deploy to Azure App Service (Linux, Python).
#
# Manual trigger only (workflow_dispatch) - this is deliberately NOT wired to fire on every push.
# It will fail until you provision an App Service and add these repository secrets:
#   AZURE_WEBAPP_NAME             - the App Service name you create
#   AZURE_WEBAPP_PUBLISH_PROFILE  - downloaded from that App Service's "Get publish profile"
# See AZURE_MIGRATION.md for the full checklist (this workflow only covers the deploy step).

name: Deploy to Azure App Service

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
