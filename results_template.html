<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Analysis Results</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23070D18'/><path d='M30 38 L70 38 L70 48 L46 48 L46 58 L64 58 L64 68 L46 68 L46 82 L30 82 Z' fill='%23FF6A2B'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Dark "broadcast scoreboard" theme (2026-09) - kept in sync by hand with index.html
           and src/ai_overview.py's inlined CSS. See index.html for the full design-system note. */
        :root {
            --void: #070D18;
            --surface: #101B2D;
            --surface-raised: #18283F;
            --surface-hover: #1F3350;
            --ink: #F4F6FA;
            --ink-muted: #8DA0BC;
            --ink-faint: #5A6E8C;
            --accent: #FF6A2B;
            --accent-deep: #C83803;
            --accent-glow: rgba(255, 106, 43, 0.35);
            --accent-soft: rgba(255, 106, 43, 0.14);
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.14);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-pill: 999px;
            --font-display: 'Oswald', 'Arial Narrow', sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --sidebar-w: 264px;
            --topbar-h: 56px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; scroll-behavior: smooth; }

        body {
            font-family: var(--font-body);
            background: var(--void);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 12% -8%, rgba(255, 106, 43, 0.16), transparent 42%),
                radial-gradient(circle at 100% 8%, rgba(66, 133, 244, 0.09), transparent 38%),
                repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 90px),
                var(--void);
        }

        h1, h2, h3, .font-display { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.01em; }

        .app-shell { position: relative; z-index: 1; display: flex; min-height: 100vh; }

        .topbar {
            position: sticky; top: 0; z-index: 30;
            display: flex; align-items: center; gap: 14px;
            height: var(--topbar-h); padding: 0 16px;
            background: rgba(7, 13, 24, 0.88);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }
        .menu-btn {
            display: flex; align-items: center; justify-content: center;
            width: 38px; height: 38px; border-radius: var(--radius-md);
            background: var(--surface-raised); border: 1px solid var(--line);
            color: var(--ink); cursor: pointer; flex-shrink: 0;
            transition: background 0.15s ease, transform 0.1s ease;
        }
        .menu-btn:hover { background: var(--surface-hover); }
        .menu-btn:active { transform: scale(0.94); }
        .menu-btn svg { width: 20px; height: 20px; }
        .topbar-title { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .topbar .back-link { margin-left: auto; font-size: 0.85rem; color: var(--ink-muted); text-decoration: none; font-weight: 600; white-space: nowrap; }
        .topbar .back-link:hover { color: var(--ink); }

        .sidebar-scrim { position: fixed; inset: 0; z-index: 35; background: rgba(3, 6, 12, 0.66); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
        .sidebar-scrim.open { opacity: 1; pointer-events: auto; }

        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: min(var(--sidebar-w), 84vw); z-index: 40;
            background: var(--surface); border-right: 1px solid var(--line);
            overflow-y: auto; transform: translateX(-100%);
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .sidebar.open { transform: translateX(0); }

        .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px 14px; }
        .sidebar-brand .mark {
            width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display); font-weight: 700; color: var(--void); font-size: 1rem; flex-shrink: 0;
        }
        .sidebar-brand .name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--ink); }
        .sidebar-brand .sub { font-size: 0.72rem; color: var(--ink-muted); }
        .sidebar-close { margin-left: auto; width: 30px; height: 30px; border-radius: var(--radius-md); background: transparent; border: none; color: var(--ink-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        @media (min-width: 960px) { .sidebar-close { display: none; } }

        .nav-scroll { flex: 1; padding: 4px 12px 20px; }
        .nav-group-label { font-size: 0.68rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; padding: 18px 10px 8px; }

        .nav-item {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 10px 12px; border-radius: var(--radius-md);
            background: transparent; border: none; color: var(--ink-muted);
            font-family: var(--font-body); font-weight: 600; font-size: 0.9rem;
            text-align: left; cursor: pointer; position: relative;
            transition: background 0.16s ease, color 0.16s ease; text-decoration: none;
        }
        .nav-item + .nav-item { margin-top: 2px; }
        .nav-item:hover { background: var(--surface-hover); color: var(--ink); }
        .nav-item.active { background: var(--surface-raised); color: var(--ink); }
        .nav-item.active::before { content: ''; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-faint); flex-shrink: 0; }
        .nav-item.active .dot { background: var(--accent); }

        .nav-subitem {
            display: block; width: 100%;
            padding: 7px 12px 7px 34px; border-radius: var(--radius-md);
            background: transparent; border: none; color: var(--ink-faint);
            font-family: var(--font-body); font-weight: 500; font-size: 0.8rem;
            text-align: left; cursor: pointer;
        }
        .nav-subitem:hover { background: var(--surface-hover); color: var(--ink-muted); }
        .nav-subitem.active { color: var(--accent); }

        .main-content { flex: 1; min-width: 0; padding: 20px 16px 64px; }
        @media (min-width: 960px) {
            .sidebar { position: sticky; top: 0; transform: none; height: 100vh; }
            .sidebar-scrim { display: none; }
            .topbar { display: none; }
            .main-content { padding: 40px 44px 80px; }
        }

        .page-wide { max-width: 1180px; margin: 0 auto; }

        .results-hero { margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
        .results-hero h2 { font-size: 1.6rem; font-weight: 600; color: var(--ink); }
        .results-hero p { color: var(--ink-muted); font-size: 0.9rem; margin-top: 4px; }

        .last-updated { color: var(--ink-faint); font-size: 0.82rem; margin-top: 8px; }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: panelIn 0.4s ease; }
        @keyframes panelIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .panel-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .panel-header h3 { font-size: 1.3rem; font-weight: 600; color: var(--ink); }
        .panel-header a.open-full { font-size: 0.85rem; color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
        .panel-header a.open-full:hover { text-decoration: underline; }
        .panel-description { color: var(--ink-muted); margin-bottom: 14px; line-height: 1.55; font-size: 0.92rem; }

        .panel-frame-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); }
        .panel-frame-wrap iframe { width: 100%; min-height: 320px; border: none; display: block; color-scheme: dark; }
        .unavailable-note { color: var(--ink-muted); font-style: italic; padding: 24px; }
    </style>
</head>
<body>
    <div class="app-shell">
        <div id="sidebarScrim" class="sidebar-scrim"></div>
        <nav id="sidebar" class="sidebar" aria-label="Report navigation">
            <div class="sidebar-brand">
                <div class="mark">F</div>
                <div>
                    <div class="name">Fantasy Football</div>
                    <div class="sub">Results</div>
                </div>
                <button id="sidebarClose" class="sidebar-close" aria-label="Close navigation">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="navScroll" class="nav-scroll"></div>
        </nav>

        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
            <header class="topbar">
                <button id="menuToggle" class="menu-btn" aria-label="Open navigation">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
                </button>
                <span class="topbar-title" id="topbarTitle">Overview</span>
                <a href="/" class="back-link">&larr; New Analysis</a>
            </header>

            <main class="main-content">
                <div class="page-wide">
                    <div class="results-hero">
                        <h2>League Results</h2>
                        <p>Pick a report from the menu to dig in.</p>
                        <div class="last-updated" id="lastUpdated">Loading analysis timestamp...</div>
                    </div>
                    <div id="tabPanels"></div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Every report the static build might have generated, grouped for the sidebar, with a
        // short description (shown above each embedded report) and the data file to check for
        // existence before embedding it - not every league has every report (e.g. no trades
        // this season means no trade_analysis file).
        const NAV_GROUPS = [
            { label: 'Overview', items: [
                { id: 'overview', title: 'Overview', file: 'ai_overview_latest.html',
                  description: "Head-to-head top performers by week, biggest upsets, power ranking movers, matchups to watch, a projected playoff bracket, median standings, and top waiver pickups.",
                  sections: [
                      { id: 'top-performers', title: 'Top Performers' },
                      { id: 'upsets', title: 'Biggest Upsets' },
                      { id: 'power-movers', title: 'Power Ranking Movers' },
                      { id: 'matchups-to-watch', title: 'Matchups to Watch' },
                      { id: 'bracket', title: 'Playoff Bracket' },
                      { id: 'median-standings', title: 'Median Standings' },
                      { id: 'waiver-pickups', title: 'Top Waiver Pickups' },
                  ] },
                { id: 'draft', title: 'Draft Info', file: 'draft_info_latest.html',
                  description: "Every manager's Draft Rating and the season's Biggest Steals - the largest gaps between a player's actual draft pick and where experts expected them to go.",
                  sections: [
                      { id: 'draft-rating', title: 'Draft Rating' },
                      { id: 'biggest-steals', title: 'Biggest Steals' },
                  ] },
            ]},
            { label: 'Team Analysis', items: [
                { id: 'power', title: 'Power Rankings', file: 'power_rating_interactive_latest.html',
                  description: "Track team performance over time with interactive power rating progression charts." },
                { id: 'power-leaderboard', title: 'Power Leaderboard', file: 'power_ranking_leaderboard_latest.html',
                  description: "A sortable leaderboard view of the same power ratings." },
                { id: 'roster', title: 'Roster Grades', file: 'roster_grades_interactive_latest.html',
                  description: "Analyze roster quality and talent distribution across all teams." },
                { id: 'luck', title: 'Luck Analysis', file: 'luck_analysis_latest.html',
                  description: "Compare regular wins to median-based performance - who's been lucky vs. unlucky." },
            ]},
            { label: 'League Activity', items: [
                { id: 'trades', title: 'Trade Analysis', file: 'trade_analysis_latest.html',
                  description: "Every league trade with player-value impact scoring (and FAAB context for leagues that use it)." },
                { id: 'waivers', title: 'Waiver Analysis', file: 'waiver_analysis_latest.html',
                  description: "Waiver wire pickups and free agent acquisitions, including FAAB spend and efficiency." },
                { id: 'managers', title: 'Manager Grades', file: 'manager_grades_latest.html',
                  description: "Comprehensive manager performance grades based on trades, waivers, and overall strategy." },
                { id: 'worst', title: 'Worst Trades', file: 'worst_trades_report_latest.html',
                  description: "The worst trades in your league with detailed impact analysis." },
            ]},
        ];

        function initSidebarToggle() {
            const sidebar = document.getElementById('sidebar');
            const scrim = document.getElementById('sidebarScrim');
            const menuBtn = document.getElementById('menuToggle');
            const closeBtn = document.getElementById('sidebarClose');
            const open = () => { sidebar.classList.add('open'); scrim.classList.add('open'); };
            const close = () => { sidebar.classList.remove('open'); scrim.classList.remove('open'); };
            menuBtn.addEventListener('click', open);
            closeBtn.addEventListener('click', close);
            scrim.addEventListener('click', close);
            window._closeSidebar = close;
        }

        function activateTab(id) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === id));
            document.querySelectorAll('.tab-panel').forEach(el => el.classList.toggle('active', el.dataset.tab === id));
            const active = document.querySelector(`.nav-item[data-tab="${id}"]`);
            document.getElementById('topbarTitle').textContent = active ? active.dataset.title : 'Fantasy Football';
            if (window._closeSidebar) window._closeSidebar();
            window.scrollTo({ top: 0, behavior: 'auto' });
        }

        // Scrolls to a section id *inside* an embedded report's iframe - used by the Overview/
        // Draft Info sub-nav so a click can jump straight to one of the several sections those
        // reports bundle onto one page. The iframe may still be `loading="lazy"` and not
        // started yet (its panel was `display:none` until this same click's activateTab() just
        // made it visible), so this waits for its 'load' event rather than assuming the
        // content is already there.
        function scrollToSectionInIframe(iframe, sectionId) {
            const tryScroll = () => {
                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    const el = doc.getElementById(sectionId);
                    if (!el) return;
                    // wireIframeAutosize() sizes this iframe to its full content height, so it
                    // has no scroll position of its own to move (the OUTER page is what
                    // actually scrolls through it) - scrollIntoView() inside the iframe's own
                    // document would be a no-op. Scroll the outer window to the section's
                    // position instead: its own offset within the iframe, plus the iframe's
                    // offset within this page.
                    const targetY = window.scrollY + iframe.getBoundingClientRect().top
                        + el.getBoundingClientRect().top - 12;
                    window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
                } catch (e) { /* not ready yet - ignore */ }
            };
            if (iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
                tryScroll();
                // Bokeh content can reflow asynchronously after 'load' (see wireIframeAutosize's
                // own ResizeObserver), which can shift the iframe's height and throw off the
                // target position computed above - one cheap follow-up corrects for that
                // without needing to track every possible reflow.
                setTimeout(tryScroll, 400);
            } else {
                iframe.addEventListener('load', () => { tryScroll(); setTimeout(tryScroll, 400); }, { once: true });
            }
        }

        function activateSection(tabId, sectionId) {
            activateTab(tabId);
            document.querySelectorAll('.nav-subitem').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tabId && el.dataset.section === sectionId);
            });
            const iframe = document.querySelector(`.tab-panel[data-tab="${tabId}"] .panel-frame-wrap iframe`);
            if (iframe) scrollToSectionInIframe(iframe, sectionId);
        }

        function autosizeIframe(iframe, force) {
            try {
                const doc = iframe.contentDocument || iframe.contentWindow.document;
                const height = Math.max(
                    doc.documentElement ? doc.documentElement.scrollHeight : 0,
                    doc.body ? doc.body.scrollHeight : 0
                );
                if (height <= 0) return;
                const newHeight = height + 24;
                const current = parseFloat(iframe.style.height) || 0;
                // Ignore sub-8px deltas - see index.html's wireIframeAutosize for the reproduced
                // bug this guards against: growing the iframe can nudge a stretch_width Bokeh
                // figure's own layout by a few px, re-triggering the observer below forever
                // without this (a real "I can scroll endlessly on mobile" report, not
                // hypothetical). Real content changes are far bigger than 8px.
                if (!force && Math.abs(newHeight - current) < 8) return;
                iframe.style.height = newHeight + 'px';
            } catch (e) { console.warn('Could not autosize iframe:', e); }
        }

        function wireIframeAutosize(iframe) {
            iframe.addEventListener('load', () => {
                autosizeIframe(iframe, true);
                try {
                    const doc = iframe.contentDocument;
                    if (doc && doc.body && 'ResizeObserver' in window) {
                        let debounceTimer = null;
                        let resizeCount = 0;
                        const startedAt = Date.now();
                        const observer = new ResizeObserver(() => {
                            // Circuit breaker: stop watching after a generous settle window so a
                            // feedback loop can't run forever - see index.html for the full
                            // reasoning.
                            resizeCount++;
                            if (resizeCount > 20 || Date.now() - startedAt > 8000) {
                                observer.disconnect();
                                return;
                            }
                            clearTimeout(debounceTimer);
                            debounceTimer = setTimeout(() => autosizeIframe(iframe), 150);
                        });
                        observer.observe(doc.body);
                    }
                } catch (e) { /* best effort */ }
            });
            window.addEventListener('resize', () => autosizeIframe(iframe, true));
        }

        async function buildNavAndPanels() {
            const navScroll = document.getElementById('navScroll');
            const tabPanels = document.getElementById('tabPanels');
            let firstId = null;

            for (const group of NAV_GROUPS) {
                const label = document.createElement('div');
                label.className = 'nav-group-label';
                label.textContent = group.label;
                navScroll.appendChild(label);

                for (const item of group.items) {
                    const navBtn = document.createElement('button');
                    navBtn.className = 'nav-item';
                    navBtn.dataset.tab = item.id;
                    navBtn.dataset.title = item.title;
                    navBtn.innerHTML = `<span class="dot"></span><span>${item.title}</span>`;
                    navBtn.addEventListener('click', () => activateTab(item.id));
                    navScroll.appendChild(navBtn);

                    if (item.sections) {
                        item.sections.forEach(section => {
                            const subBtn = document.createElement('button');
                            subBtn.className = 'nav-subitem';
                            subBtn.dataset.tab = item.id;
                            subBtn.dataset.section = section.id;
                            subBtn.textContent = section.title;
                            subBtn.addEventListener('click', () => activateSection(item.id, section.id));
                            navScroll.appendChild(subBtn);
                        });
                    }

                    const panel = document.createElement('section');
                    panel.className = 'tab-panel';
                    panel.dataset.tab = item.id;
                    panel.innerHTML = `
                        <div class="panel-header"><h3>${item.title}</h3></div>
                        <p class="panel-description">${item.description}</p>
                        <div class="panel-frame-wrap" data-file="${item.file}"></div>
                    `;
                    tabPanels.appendChild(panel);
                    if (!firstId) firstId = item.id;

                    try {
                        const response = await fetch(item.file, { method: 'HEAD' });
                        const wrap = panel.querySelector('.panel-frame-wrap');
                        if (response.ok) {
                            const iframe = document.createElement('iframe');
                            iframe.src = item.file;
                            iframe.loading = 'lazy';
                            wrap.appendChild(iframe);
                            wireIframeAutosize(iframe);

                            const openLink = document.createElement('a');
                            openLink.className = 'open-full';
                            openLink.href = item.file;
                            openLink.target = '_blank';
                            openLink.rel = 'noopener noreferrer';
                            openLink.innerHTML = 'Open full size &#8599;';
                            panel.querySelector('.panel-header').appendChild(openLink);
                        } else {
                            wrap.innerHTML = '<p class="unavailable-note">Not generated for this analysis.</p>';
                        }
                    } catch (error) {
                        panel.querySelector('.panel-frame-wrap').innerHTML = '<p class="unavailable-note">Not generated for this analysis.</p>';
                    }
                }
            }

            if (firstId) activateTab(firstId);
        }

        initSidebarToggle();
        buildNavAndPanels();

        fetch('data/fantasy_analysis_latest.json')
            .then(response => response.json())
            .then(data => {
                const timestamp = data.analysis_info?.timestamp;
                if (timestamp) {
                    const date = new Date(timestamp);
                    document.getElementById('lastUpdated').textContent =
                        `Last updated: ${date.toLocaleDateString()} at ${date.toLocaleTimeString()}`;
                }
            })
            .catch(() => { document.getElementById('lastUpdated').textContent = 'Analysis data loading...'; });
    </script>
</body>
</html>
